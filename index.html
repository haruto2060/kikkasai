<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>イカ焼き注文管理</title>
<style>
body { font-family: sans-serif; padding: 20px; max-width: 700px; margin: auto; }
button { margin: 5px 4px; padding: 10px 14px; font-size:16px; border-radius:6px; }
button.selected { background-color: #aaf; }
table { width: 100%; border-collapse: collapse; margin-top: 15px; }
th, td { border: 1px solid #aaa; padding: 8px; text-align: center; font-size:15px; }
.completed { background-color: #d4ffd4; }
.section { margin-top: 15px; }
.section-scroll { overflow-x:auto; white-space:nowrap; }
.section-scroll button { display:inline-block; min-width:45px; }
</style>
</head>
<body>

<h2>イカ焼き注文管理</h2>
<div id="errorBox" style="display:none;background:#fdd;border:1px solid #c00;padding:8px;margin-bottom:10px;"></div>

<!-- 整理番号 -->
<div class="section section-scroll">
  整理番号:
  <span id="seqButtons"></span>
</div>

<!-- 種類 -->
<div class="section">
  種類:
  <button onclick="toggleButton(this,'type','ノーマル')">ノーマル</button>
  <button onclick="toggleButton(this,'type','明太')">明太</button>
  <button onclick="toggleButton(this,'type','チーズ')">チーズ</button>
  <button onclick="toggleButton(this,'type','ねぎ')">ねぎ</button>
  <button onclick="toggleButton(this,'type','明太チーズ')">明太チーズ</button>
  <button onclick="toggleButton(this,'type','明太ねぎ')">明太ねぎ</button>
  <button onclick="toggleButton(this,'type','チーズねぎ')">チーズねぎ</button>
  <button onclick="toggleButton(this,'type','ポン酢')">ポン酢</button>
  <button onclick="toggleButton(this,'type','ネギポン')">ネギポン</button>
</div>

<!-- 数量 -->
<div class="section">
  数量:
  <button onclick="toggleButton(this,'qty',1)">1</button>
  <button onclick="toggleButton(this,'qty',2)">2</button>
  <button onclick="toggleButton(this,'qty',3)">3</button>
  <button onclick="toggleButton(this,'qty',4)">4</button>
  <button onclick="toggleButton(this,'qty',5)">5</button>
  <button onclick="confirmAddOrder()">注文追加</button>
</div>

<p>合計個数: <span id="totalQty">0</span> / 合計金額: <span id="totalPrice">0</span>円</p>

<table id="orderTable">
  <thead>
    <tr>
      <th>整理番号</th>
      <th>種類</th>
      <th>数量</th>
      <th>金額</th>
      <th>ステータス</th>
      <th>削除</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
// Firebase初期化
const firebaseConfig = {
  apiKey: "AIzaSyA5za41c77R-Bt8BAaYhq5J9PPIzOet464",
  authDomain: "kikkasai.firebaseapp.com",
  projectId: "kikkasai",
  storageBucket: "kikkasai.firebasestorage.app",
  messagingSenderId: "805719964296",
  appId: "1:805719964296:web:804e39d34bf7096f0e7d3d"
};
let db = null;
function showError(msg){
  const el = document.getElementById("errorBox");
  el.style.display = "block";
  el.textContent = msg;
}
function loadScript(src){
  return new Promise((resolve,reject)=>{
    const s = document.createElement("script");
    s.src = src;
    s.onload = resolve;
    s.onerror = ()=>reject(new Error(src));
    document.head.appendChild(s);
  });
}
// 上から順に試す（最初がだめなら次の場所から読み込む）
const firebaseSources = [
  ["https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js",
   "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"],
  ["https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-app-compat.js",
   "https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-firestore-compat.js"],
  ["https://unpkg.com/firebase@9.23.0/firebase-app-compat.js",
   "https://unpkg.com/firebase@9.23.0/firebase-firestore-compat.js"]
];
async function connectFirebase(){
  let lastErr = null;
  for(const srcs of firebaseSources){
    try {
      for(const s of srcs) await loadScript(s);
      if(typeof firebase !== "undefined"){
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        return true;
      }
    } catch(e) {
      lastErr = e;
    }
  }
  showError("Firebaseに接続できません。読み込めなかった場所: " + (lastErr ? lastErr.message : "不明"));
  return false;
}

let selected = { seq:null, type:'', qty:null };
const itemPrices = {
  "ノーマル":500, 
  "明太":600, 
  "チーズ":600, 
  "ねぎ":600,
  "明太チーズ":650, 
  "明太ねぎ":650, 
  "チーズねぎ":650,
  "ポン酢":600,
  "ネギポン":600
};
let orders = [];

// 整理番号ボタン生成
const seqContainer = document.getElementById("seqButtons");
for(let i=1;i<=50;i++){
  const btn = document.createElement("button");
  btn.textContent=i;
  btn.onclick=()=>toggleButton(btn,'seq',i);
  seqContainer.appendChild(btn);
}

// ボタン選択
function toggleButton(btn,key,value){
  if(selected[key]===value){
    selected[key]=(key==='qty'||key==='seq')? null:''; 
    btn.classList.remove('selected');
  } else {
    selected[key]=value;
    Array.from(btn.parentElement.children).forEach(b=>{ if(b!==btn) b.classList.remove('selected'); });
    btn.classList.add('selected');
  }
}

// 注文追加
function confirmAddOrder(){
  if(!selected.seq){ alert("整理番号を選んでね"); return; }
  if(!selected.type){ alert("種類を選んでね"); return; }
  if(!selected.qty){ alert("数量を選んでね"); return; }

  if(!db){ alert("Firebaseに接続できないため、注文を保存できません"); return; }

  const unitPrice = itemPrices[selected.type] || 0;

  const newOrder = {
    seq: selected.seq,
    type: selected.type,
    qty: selected.qty,
    price: unitPrice,
    total: unitPrice * selected.qty,
    status: 0,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  };

  db.collection("orders").add(newOrder).then(()=>{
    selected = { seq:null, type:'', qty:null };
    document.querySelectorAll('.section button').forEach(b=>b.classList.remove('selected'));
  });
}

// Firestoreリアルタイム取得
function startListening(){
  if(!db) return;
  db.collection("orders").orderBy("createdAt").onSnapshot(snapshot=>{
    orders=[];
    snapshot.forEach(doc=>{
      const data=doc.data(); data.id=doc.id;
      orders.push(data);
    });
    renderOrders();
  }, err=>{
    showError("注文データを読み込めません: " + err.message);
  });
}

// 表示
function renderOrders(){
  const tbody=document.querySelector("#orderTable tbody");
  tbody.innerHTML='';

  let filtered = orders.sort((a,b)=>{
    if(a.status!==b.status) return a.status-b.status;
    return a.seq-b.seq;
  });

  let totalQty=0,totalPrice=0;
  filtered.forEach(o=>{
    const itemTotal = o.total ?? (o.qty * o.price);
    totalQty+=o.qty;
    totalPrice+=itemTotal;

    const tr=document.createElement("tr");
    if(o.status===1) tr.classList.add("completed");
    tr.innerHTML=`
      <td>${o.seq}</td>
      <td>${o.type}</td>
      <td>${o.qty}</td>
      <td>${itemTotal}</td>
      <td><button onclick="toggleStatus('${o.id}',${o.status})">${o.status===0?'未完了':'完了'}</button></td>
      <td><button onclick="deleteOrder('${o.id}',this)">削除</button></td>
    `;
    tbody.appendChild(tr);
  });

  document.getElementById("totalQty").textContent=totalQty;
  document.getElementById("totalPrice").textContent=totalPrice;
}

// ステータス変更
function toggleStatus(id,status){
  const newStatus=status===0?1:0;
  db.collection("orders").doc(id).update({status:newStatus}).catch(e=>{
    showError("ステータスを変更できませんでした: " + e.message);
  });
}

// 削除
// 1回目で「本当に削除」に変わり、3秒以内にもう1回押すと削除（確認画面が出ない環境でも動く）
function deleteOrder(id, btn){
  if(btn.dataset.armed !== "1"){
    btn.dataset.armed = "1";
    btn.textContent = "本当に削除";
    btn.style.background = "#fbb";
    setTimeout(()=>{
      if(btn.isConnected){
        btn.dataset.armed = "0";
        btn.textContent = "削除";
        btn.style.background = "";
      }
    }, 3000);
    return;
  }
  db.collection("orders").doc(id).delete().catch(e=>{
    showError("削除できませんでした: " + e.message);
  });
}

// 起動
connectFirebase().then(startListening);
</script>
</body>
</html>
